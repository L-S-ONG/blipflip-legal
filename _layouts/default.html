<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem;
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           color: #1B1735; background: #FFF6E0; }
    h1, h2, h3 { line-height: 1.25; }
    a { color: #5b4bdb; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #d9d4c2; padding: .5rem; text-align: left; vertical-align: top; }
    code { background: #fff; padding: .1rem .3rem; border-radius: 4px; }
    blockquote { border-left: 3px solid #d9d4c2; margin: 1rem 0; padding: .25rem 1rem; color: #555; }
    hr { border: none; border-top: 1px solid #e7e1cf; margin: 2rem 0; }
  </style>
</head>
<body>
{{ content }}
</body>
</html>
